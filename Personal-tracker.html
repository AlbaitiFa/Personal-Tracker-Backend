    html += '<div class="btn-row"><button class="add-row-btn" id="addAccount">+ Add bank account</button><button class="btn" id="openObBtn">Add Opening Balance</button></div></div>';

    html += '<div class="settings-section"><h4>Debt &amp; net worth</h4>';
    html += '<div class="field"><label>Debts</label></div>';
    html += state.debts.map(function (deb) {
      var debOpening = debtOpeningTx(deb.id);
      return '<div class="acct-edit-row" data-debt="' + deb.id + '">' +
        '<div class="acct-edit-top">' +
          '<input class="input" data-field="name" value="' + esc(deb.name) + '" placeholder="Name">' +
          '<button class="del-btn" data-del-debt="' + deb.id + '" aria-label="Remove debt">' + xIcon() + '</button>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field" style="margin:0"><label>Direction</label><select class="select" data-field="direction">' +
            '<option value="owed_to_me"' + (deb.direction === "owed_to_me" ? " selected" : "") + '>Owed to me</option>' +

        '</div>' +

    html += '<button class="add-row-btn" id="addDebt">+ Add debt</button>';
    html += '<hr class="div" style="margin:16px 0">';
    html += '<div class="field"><label>Installments</label></div>';
    html += state.installments.map(function (inst) {
      var instOpening = installmentOpeningTx(inst.id);
      return '<div class="acct-edit-row" data-installment="' + inst.id + '">' +

          '<div class="field" style="margin:0"><label>Installments left / total</label><div class="row2"><input class="input" type="number" step="1" min="0" data-field="installmentsLeft" value="' + (inst.installmentsLeft || 0) + '" placeholder="Left"><input class="input" type="number" step="1" min="0" data-field="installmentsTotal" value="' + (inst.installmentsTotal || 0) + '" placeholder="Total"></div></div>' +

        '</div>' +
      '</div>';

    html += '<hr class="div">';
    html += '<div class="settings-section"><h4>Data</h4>' +
      '<div class="btn-row"><button class="btn" id="exportBtn">Export backup</button><button class="btn" id="importBtn">Import backup</button></div>' +
      '<input type="file" id="importFile" accept="application/json,.json">' +
      '<button class="btn btn-danger" id="resetBtn" style="margin-top:10px">Reset all data</button>' +
      '</div>';

    sheet.innerHTML = html;

  function wireSettingsSheet() {
    var sheet = document.getElementById("settingsSheet");
    sheet.querySelector("#setClose").addEventListener("click", closeSettingsSheet);

    sheet.querySelector("#sPerson").addEventListener("input", function (e) { state.person = e.target.value; persist(); });
    sheet.querySelector("#sCurrency").addEventListener("input", function (e) { state.currency = e.target.value; persist(); });
    var singleIncomeInput = sheet.querySelector("#sMonthlyIncome");
    if (singleIncomeInput) {
      singleIncomeInput.addEventListener("input", function (e) {
        if (!state.incomeSources.length) state.incomeSources.push({ id: uid(), name: "Monthly Income", frequency: "Monthly", amount: 0 });
        state.incomeSources[0].amount = Math.max(0, parseFloat(e.target.value) || 0);
        persist(); render();
      });
    }
    function refreshIncomeTotalDisplay() {
      var totalField = sheet.querySelector("#sMonthlyIncomeTotal");
      if (totalField) totalField.value = fmt(state.incomeSources.reduce(function (s, src) { return s + monthlyEquivalentAmount(src.amount, src.frequency); }, 0));
    }
    sheet.querySelectorAll(".acct-edit-row[data-income]").forEach(function (row) {
      var id = row.getAttribute("data-income");
      var src = incomeSourceById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          var field = inp.getAttribute("data-field");
          src[field] = field === "amount" ? (parseFloat(inp.value) || 0) : inp.value;
          persist();
          if (field === "amount" || field === "frequency") refreshIncomeTotalDisplay();
          render();
        });
      });
    });
    sheet.querySelectorAll("[data-del-income]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-income");
        if (state.transactions.some(function (t) { return t.type === "draw" && t.sourceId === id; })) { showToast("Can't remove an income source used in existing draws."); return; }
        state.incomeSources = state.incomeSources.filter(function (s) { return s.id !== id; });
        persist(); renderSettingsSheet(); render();
      });
    });
    sheet.querySelector("#addIncomeSource").addEventListener("click", function () {
      state.incomeSources.push({ id: uid(), name: "New source", amount: 0, frequency: "Undefined" });
      persist(); renderSettingsSheet();
    });

    sheet.querySelectorAll(".bucket-edit-row").forEach(function (row) {
      var id = row.getAttribute("data-bucket");
      var b = bucketById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          var field = inp.getAttribute("data-field");
          if (field === "linkedAccountId") b.linkedAccountId = inp.value || null;
          else if (field === "cap") b.cap = parseFloat(inp.value) || 0;
          else b[field] = inp.value;
          persist();
          if (field === "cap") {
            var note = sheet.querySelector(".sum-note");
            if (note) { var s = pctSum(); note.textContent = "Share total: " + s + "%" + (s === 100 ? " — splits nicely into 100%" : " — should add up to 100% or splits will be off"); note.className = "sum-note " + (s === 100 ? "ok" : "bad"); }
          }
          if (evt === "change") render();
        });
      });
    });
    sheet.querySelectorAll("[data-del-bucket]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-bucket");
        if (state.buckets.length <= 1) { showToast("You need at least one Bucket."); return; }
        if (bucketUsedInTx(id)) { showToast("Can't remove a Bucket used in existing transactions."); return; }
        state.buckets = state.buckets.filter(function (b) { return b.id !== id; });
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelector("#addBucket").addEventListener("click", function () {
      state.buckets.push({ id: uid(), name: "New Bucket", cap: 0, linkedAccountId: null });
      persist(); renderSettingsSheet();
    });

    sheet.querySelectorAll(".acct-edit-row[data-account]").forEach(function (row) {
      var id = row.getAttribute("data-account");
      var a = accountById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        inp.addEventListener("input", function () { a[inp.getAttribute("data-field")] = inp.value; persist(); });
      });
    });
    sheet.querySelectorAll('input[name="defaultAccountRadio"]').forEach(function (radio) {
      radio.addEventListener("change", function (e) { state.defaultAccountId = e.target.value; persist(); render(); });
    });
    sheet.querySelectorAll("[data-del-account]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-account");
        if (state.accounts.length <= 1) { showToast("You need at least one bank account."); return; }
        if (accountUsedInTx(id)) { showToast("Can't remove a bank account used in existing transactions."); return; }
        if (accountLinkedToBucket(id)) { showToast("Can't remove a bank account linked to an Account — unlink it first."); return; }
        state.accounts = state.accounts.filter(function (a) { return a.id !== id; });
        if (state.defaultAccountId === id) state.defaultAccountId = null;
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelectorAll("[data-move-account]").forEach(function (btn) {
      btn.addEventListener("click", function () { moveAccount(btn.getAttribute("data-move-account"), btn.getAttribute("data-dir")); });
    });
    sheet.querySelector("#addAccount").addEventListener("click", function () {
      state.accounts.push({ id: uid(), name: "New bank account" });
      persist(); renderSettingsSheet();
    });
    var openObBtn = sheet.querySelector("#openObBtn");
    if (openObBtn) openObBtn.addEventListener("click", function () { openObSheet(); });

    sheet.querySelectorAll(".acct-edit-row[data-debt]").forEach(function (row) {
      var id = row.getAttribute("data-debt");
      var deb = debtById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var field = inp.getAttribute("data-field");
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          if (field === "openingBalance") { setDebtOpeningBalance(id, Math.max(0, parseFloat(inp.value) || 0)); }
          else { deb[field] = inp.value; }
          persist(); render();
        });
      });
    });
    sheet.querySelectorAll("[data-del-debt]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-debt");
        if (debtUsedInTx(id)) { showToast("Can't remove a debt used in existing transactions."); return; }
        state.debts = state.debts.filter(function (d) { return d.id !== id; });
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelector("#addDebt").addEventListener("click", function () {
      state.debts.push({ id: uid(), name: "New debt", direction: "owed_to_me" });
      persist(); renderSettingsSheet();
    });

    sheet.querySelectorAll(".acct-edit-row[data-installment]").forEach(function (row) {
      var id = row.getAttribute("data-installment");
      var inst = installmentById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var numericFields = ["monthlyAmount", "installmentsLeft", "installmentsTotal", "lateCount", "balloon"];
        inp.addEventListener("input", function () {
          var field = inp.getAttribute("data-field");
          if (field === "openingBalance") { setInstallmentOpeningBalance(id, Math.max(0, parseFloat(inp.value) || 0)); persist(); render(); return; }
          inst[field] = numericFields.indexOf(field) !== -1 ? (parseFloat(inp.value) || 0) : inp.value;
          persist();
          render();
        });
      });
    });
    sheet.querySelectorAll("[data-del-installment]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-installment");
        if (installmentUsedInTx(id)) { showToast("Can't remove an installment used in existing transactions."); return; }
        state.installments = state.installments.filter(function (i) { return i.id !== id; });
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelector("#addInstallment").addEventListener("click", function () {
      state.installments.push({ id: uid(), name: "New installment", monthlyAmount: 0, purpose: "", installmentsTotal: 0, installmentsLeft: 0, lateCount: 0, balloon: 0 });
      persist(); renderSettingsSheet();
    });

    sheet.querySelector("#exportBtn").addEventListener("click", handleExport);
    sheet.querySelector("#importBtn").addEventListener("click", function () { sheet.querySelector("#importFile").click(); });
    sheet.querySelector("#importFile").addEventListener("change", handleImport);
    sheet.querySelector("#resetBtn").addEventListener("click", handleReset);
  }

  /* ---------------- opening balance sheet ---------------- */
  function openObSheet() { document.getElementById("obOverlay").classList.add("open"); renderObSheet(); }
  function closeObSheet() { document.getElementById("obOverlay").classList.remove("open"); }

  function renderObSheet() {
    var sheet = document.getElementById("obSheet");
    if (!state.accounts.length) {
      sheet.innerHTML = '<div class="sheet-head"><h3>Add Opening Balance</h3><button class="icon-btn" id="obClose" aria-label="Close">' + xIcon() + '</button></div>' +
        '<div class="empty-state">Add a bank account first (Settings → Bank Accounts).</div>';
      sheet.querySelector("#obClose").addEventListener("click", closeObSheet);
      return;
    }
    var html = '<div class="sheet-head"><h3>Add Opening Balance</h3><button class="icon-btn" id="obClose" aria-label="Close">' + xIcon() + '</button></div>';
    html += '<div class="ledger-note" style="margin-bottom:14px">Pre-existing cash a bank account already held before this tracker started.</div>';
    html += '<div class="field"><label>Bank account</label><select class="select" id="obAccount">' +
      state.accounts.map(function (a) { return '<option value="' + a.id + '">' + esc(a.name) + '</option>'; }).join("") +
    '</select></div>';
    html += '<div class="row2">' +
      '<div class="field"><label>Date</label><input class="input" type="date" id="obDate" value="' + todayStr() + '"></div>' +
      '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" min="0" id="obAmount" placeholder="0.00"></div>' +
    '</div>';
    html += '<label class="check-row"><input type="checkbox" id="obHistorical"> Historical (no Bucket split needed)</label>' +
      '<div class="ledger-note" style="margin:2px 0 10px">For cash that isn\'t part of the Give/FFA/Investment/Lifestyle system — e.g. Cash on hand, a side account. Counts toward the bank total only.</div>';
    html += '<div class="field" id="obBucketField"><label>Allocate to</label><select class="select" id="obBucket">' +
      '<option value="__auto__">Split like a draw (Bucket %)</option>' +
      state.buckets.map(function (b) { return '<option value="' + b.id + '">' + esc(b.name) + ' only</option>'; }).join("") +
    '</select></div>';
    html += '<button class="btn btn-primary" id="obSubmit" style="margin-top:14px">Add opening balance</button>';
    sheet.innerHTML = html;
    sheet.querySelector("#obClose").addEventListener("click", closeObSheet);
    sheet.querySelector("#obSubmit").addEventListener("click", handleObSubmit);
    sheet.querySelector("#obHistorical").addEventListener("change", function (e) {
      sheet.querySelector("#obBucketField").style.display = e.target.checked ? "none" : "";
    });
  }

  function handleObSubmit() {
    var sheet = document.getElementById("obSheet");
    var accountId = sheet.querySelector("#obAccount").value;
    var date = sheet.querySelector("#obDate").value || todayStr();
    var amount = round2(parseFloat(sheet.querySelector("#obAmount").value) || 0);
    if (!amount || amount <= 0) { showToast("Enter an opening balance amount greater than zero."); return; }
    var historical = sheet.querySelector("#obHistorical").checked;
    var allocation;
    if (historical) {
      allocation = {};
    } else {
      var choice = sheet.querySelector("#obBucket").value;
      if (choice === "__auto__") {
        var sum = pctSum();
        if (sum <= 0) { showToast("Set Bucket share % in Settings first, or pick one specific Bucket instead."); return; }
        allocation = computeSplit(amount);
      } else {
        allocation = {};
        allocation[choice] = amount;
      }
    }
    var acct = accountById(accountId);
    state.transactions.push({
      id: uid(),
      type: "opening_balance",
      date: date,
      description: "Opening balance — " + (acct ? acct.name : "account"),
      amount: amount,
      accountId: accountId,
      allocation: allocation,
      createdAt: Date.now()
    });
    persist();
    closeObSheet();
    renderSettingsSheet();
    render();
    showToast("Opening balance added.");
  }

  /* ---------------- data: export / import / reset ---------------- */
  function slug(s) { return String(s || "personal-tracker").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "personal-tracker"; }

  function browserDownload(filename, json) {
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup saved.");
  }

  function handleExport() { browserDownload(slug(state.person) + "-backup-" + todayStr() + ".json", JSON.stringify(state, null, 2)); }

  function handleImport(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch (err) { showToast("That file isn't valid JSON."); return; }
      if (!parsed || !Array.isArray(parsed.buckets) || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) {
        showToast("That file doesn't look like a backup from this app.");
        return;
      }
      openConfirm("Import this backup? It will replace everything currently in the app.", "Import", true).then(function (ok) {
        if (!ok) return;
        state = Object.assign(defaultState(), parsed);
        persist();
        renderSettingsSheet();
        render();
        showToast("Backup imported.");
      });
    };
    reader.readAsText(file);
  }

  function handleReset() {
    openConfirm("Reset all data? Buckets, bank accounts, debts, installments, and every transaction will be permanently deleted from this device.", "Reset everything", true).then(function (ok) {
      if (!ok) return;
      state = defaultState();
      persist();
      renderSettingsSheet();
      render();
      showToast("Reset to a blank tracker.");
    });
  }

  /* ---------------- global wiring ---------------- */
  document.getElementById("fabBtn").addEventListener("click", function () { if (!this.disabled) openTxSheet("draw"); });
  document.getElementById("settingsBtn").addEventListener("click", openSettingsSheet);
  document.getElementById("syncBtn").addEventListener("click", function () { syncFromServer(false); });

  // The topbar's height is padding-based, not fixed - .frozen-top (Bank
  // Accounts + Buckets, pinned below it) needs that exact height as its
  // own sticky `top`, so it's measured here instead of hardcoded.
  function updateTopbarHeightVar() {
    var header = document.querySelector("header.topbar");
    if (header) document.documentElement.style.setProperty("--topbar-h", header.getBoundingClientRect().height + "px");
  }
  updateTopbarHeightVar();
  window.addEventListener("resize", function () {
    updateTopbarHeightVar();
    updateArrowDockVar(manuallyFrozen);
  });

  // Bank Accounts + Buckets stay unfrozen (normal scroll) by default - no
  // separate on/off setting to manage. The arrow is only eligible to show
  // at all once scrolled past FREEZE_SCROLL_THRESHOLD (no point offering
  // to pin/collapse something already at the top) - within that, it fades
  // in while actively scrolling and on hover (CSS :hover, see .eligible
  // above), fading back out once scrolling stops and the mouse isn't over
  // it. It's a single toggle that flips both look and job with the frozen
  // state: double-down "pin it" when unfrozen, double-up "collapse it"
  // when frozen (updateArrowVisual below) - tapping it either freezes for
  // this scroll-down session, or collapses back to unfrozen right away.
  // Scrolling back near the top also resets to unfrozen either way.
  var FREEZE_SCROLL_THRESHOLD = 24;
  var SCROLL_IDLE_MS = 900;
  var manuallyFrozen = false;
  var scrollIdleTimer = null;
  var ARROW_ICON_DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 8 12 13 17 8"/><polyline points="7 14 12 19 17 14"/></svg>';
  var ARROW_ICON_UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 8 17 13"/><polyline points="7 19 12 14 17 19"/></svg>';
  function updateArrowVisual(frozen) {
    var btn = document.getElementById("unfreezeArrow");
    var label = frozen ? "Collapse Bank Accounts & Buckets" : "Freeze Bank Accounts & Buckets";
    btn.setAttribute("aria-label", label);
    btn.setAttribute("title", label);
    btn.innerHTML = frozen ? ARROW_ICON_UP : ARROW_ICON_DOWN;
  }
  // Unfrozen, the arrow docks just under the header (topbar-h+4) because
  // by the time it reaches that point .frozen-top has already scrolled out
  // of the way. Frozen, .frozen-top stays pinned and occupies real screen
  // space instead - docking at that same shallow offset would land the
  // arrow in the middle of the pinned accounts/buckets content instead of
  // below it, so it needs to target topbar-h + the whole pinned block's
  // own height instead.
  function updateArrowDockVar(frozen) {
    var topbarH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--topbar-h")) || 64;
    var dock = frozen ? topbarH + document.getElementById("frozenTop").offsetHeight : topbarH + 4;
    document.documentElement.style.setProperty("--arrow-dock-top", dock + "px");
  }
  function updateFreezeUI() {
    var scrolled = window.scrollY > FREEZE_SCROLL_THRESHOLD;
    if (!scrolled) manuallyFrozen = false;
    var frozen = manuallyFrozen;
    document.getElementById("frozenTop").classList.toggle("is-frozen", frozen);
    document.getElementById("frozenTop").classList.toggle("is-scrolled", scrolled);
    document.querySelector("header.topbar").classList.toggle("frozen-active", frozen);
    document.getElementById("unfreezeArrow").classList.toggle("eligible", scrolled);
    updateArrowVisual(frozen);
    // frozen-active drops the header's 1px bottom border (avoids a doubled
    // line against .frozen-top's own border) - that shrinks the header by
    // 1px, so --topbar-h has to be remeasured right here, or .frozen-top's
    // sticky `top` stays pinned to the old (taller) height and leaves a
    // 1px void above it.
    updateTopbarHeightVar();
    updateArrowDockVar(frozen);
  }
  function markActivelyScrolling() {
    document.getElementById("unfreezeArrow").classList.add("is-active-scroll");
    clearTimeout(scrollIdleTimer);
    scrollIdleTimer = setTimeout(function () {
      document.getElementById("unfreezeArrow").classList.remove("is-active-scroll");
    }, SCROLL_IDLE_MS);
  }
  window.addEventListener("scroll", function () { updateFreezeUI(); markActivelyScrolling(); }, { passive: true });
  updateFreezeUI();
  document.getElementById("unfreezeArrow").addEventListener("click", function () {
    manuallyFrozen = !manuallyFrozen;
    updateFreezeUI();
  });

  render();
  syncFromServer(true);
})();
</script>
