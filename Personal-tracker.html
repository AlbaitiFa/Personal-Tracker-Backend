  function installmentOpeningTx(installmentId) { return state.transactions.find(function (t) { return t.type === "installment_payment" && t.installmentId === installmentId && t.opening; }); }
  function setDebtOpeningBalance(debtId, amount) {
    var tx = debtOpeningTx(debtId);
    if (tx) { tx.amount = amount; }
    else { state.transactions.push({ id: uid(), type: "debt_entry", debtId: debtId, amount: amount, date: todayStr(), description: "Opening balance", opening: true, createdAt: Date.now() }); }
  }
  function setInstallmentOpeningBalance(installmentId, amount) {
    var tx = installmentOpeningTx(installmentId);
    if (tx) { tx.amount = amount; }
    else { state.transactions.push({ id: uid(), type: "installment_payment", installmentId: installmentId, amount: amount, date: todayStr(), description: "Opening balance", opening: true, createdAt: Date.now() }); }
  }
  function incomeSourceById(id) { return state.incomeSources.find(function (s) { return s.id === id; }); }
  function defaultIncomeSourceId() { return state.incomeSources[0] ? state.incomeSources[0].id : null; }
  function effectiveBucketAccountId(bucket) {
    if (bucket && bucket.linkedAccountId && accountById(bucket.linkedAccountId)) return bucket.linkedAccountId;
    if (state.defaultAccountId && accountById(state.defaultAccountId)) return state.defaultAccountId;
    return (state.accounts[0] && state.accounts[0].id) || null;
  }

  // Mirrors the company tracker's computeIncomeSplit() exactly: each bucket
  // except the last gets its CAP share rounded to a whole number (no cents —
  // same as Prudy's original personal-finances-tracker artifact, "rounded to
  // the nearest whole SAR"); the last bucket absorbs whatever fractional
  // remainder is left, so the parts always sum exactly to the whole amount.
  function computeSplit(amount) {
    var buckets = state.buckets;
    var split = {}, running = 0;
    buckets.forEach(function (b, i) {
      if (i === buckets.length - 1) { split[b.id] = round2(amount - running); }
      else { var amt = Math.round(amount * (Number(b.cap) || 0) / 100); split[b.id] = amt; running += amt; }
    });
    return split;
  }

  function thisMonthStart() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01"; }

  function computeDerived() {
    var accountBalances = {}; state.accounts.forEach(function (a) { accountBalances[a.id] = 0; });
    var bucketBalances = {}; state.buckets.forEach(function (b) { bucketBalances[b.id] = 0; });
    var debtBalances = {}; state.debts.forEach(function (d) { debtBalances[d.id] = 0; });
    var installmentBalances = {}; state.installments.forEach(function (i) { installmentBalances[i.id] = 0; });
    var receivedBySource = {}; state.incomeSources.forEach(function (s) { receivedBySource[s.id] = 0; });
    var monthStart = thisMonthStart();

    state.transactions.forEach(function (tx) {
      if (tx.type === "draw") {
        var srcId = tx.sourceId || defaultIncomeSourceId();
        // historical = predates the Account-split system (and entitlement
        // tracking) - real money, so it still hits the bank account's
        // balance normally, it just doesn't split across Accounts and
        // doesn't count toward "received this month". Emergency is
        // different: it never lands in a bank account at all (spent
        // directly on a bill), but still counts toward the entitlement.
        if (!tx.historical && tx.date >= monthStart && srcId in receivedBySource) receivedBySource[srcId] = round2(receivedBySource[srcId] + tx.amount);
        if (!tx.emergency) {
          if (tx.accountId in accountBalances) accountBalances[tx.accountId] = round2(accountBalances[tx.accountId] + tx.amount);
          if (!tx.historical) {
            Object.keys(tx.split || {}).forEach(function (bid) { if (bid in bucketBalances) bucketBalances[bid] = round2(bucketBalances[bid] + tx.split[bid]); });
          }
        }
      } else if (tx.type === "expense") {
        // Opposite of draw: a historical expense already happened before a
        // LATER bank account opening balance that already reflects it (e.g.
        // Cash on hand's current total already has this spending baked in),
        // so it's record-only - doesn't touch the account or an Account.
        // A historical draw is the reverse case (real cash coming IN before
        // the split system existed, not yet reflected anywhere), so it still
        // hits the account.
        if (!tx.historical) {
          if (tx.bucketId in bucketBalances) bucketBalances[tx.bucketId] = round2(bucketBalances[tx.bucketId] - tx.amount);
          if (tx.accountId in accountBalances) accountBalances[tx.accountId] = round2(accountBalances[tx.accountId] - tx.amount);
        }
      } else if (tx.type === "debt_entry") {
        if (tx.debtId in debtBalances) debtBalances[tx.debtId] = round2(debtBalances[tx.debtId] + tx.amount);
        // Most debt entries are ledger-only (a paper record of who owes
        // what), but when real cash actually moved through one of my own
        // accounts (tx.accountId set), it also hits that account - sign
        // depends on which way the debt points: for "owed_by_me" the raw
        // signed amount already matches cash flow (increase = money in,
        // decrease/repayment = money out), but for "owed_to_me" it's the
        // opposite (increase = I lent more, money out; decrease = they
        // repaid me, money in), so that direction flips the sign.
        if (tx.accountId && tx.accountId in accountBalances) {
          var debForAcct = debtById(tx.debtId);
          var debtAcctSign = (debForAcct && debForAcct.direction === "owed_to_me") ? -1 : 1;
          accountBalances[tx.accountId] = round2(accountBalances[tx.accountId] + debtAcctSign * tx.amount);
        }
      } else if (tx.type === "installment_payment") {
        if (tx.installmentId in installmentBalances) installmentBalances[tx.installmentId] = round2(installmentBalances[tx.installmentId] + tx.amount);
        // Same idea as debt_entry above - an installment is always money I
        // owe, so its raw signed amount (negative for a real payment)
        // already matches the cash-flow direction, no sign flip needed.
        if (tx.accountId && tx.accountId in accountBalances) {
          accountBalances[tx.accountId] = round2(accountBalances[tx.accountId] + tx.amount);
        }
      } else if (tx.type === "opening_balance") {
        // Pre-existing cash, not a draw: never counted toward the Owner's Pay
        // entitlement (receivedBySource only sums "draw" transactions),
        // just an account-balance seed that lands directly in the Account(s)
        // it's allocated to. Mirrors the company tracker's own opening_balance branch.
        if (tx.accountId in accountBalances) accountBalances[tx.accountId] = round2(accountBalances[tx.accountId] + tx.amount);
        Object.keys(tx.allocation || {}).forEach(function (bid) { if (bid in bucketBalances) bucketBalances[bid] = round2(bucketBalances[bid] + tx.allocation[bid]); });
      }
    });

    return { accountBalances: accountBalances, bucketBalances: bucketBalances, debtBalances: debtBalances, installmentBalances: installmentBalances, receivedBySource: receivedBySource };
  }

  /* ---------------- render ---------------- */
  var lastDerived = null;

  function render() {
    document.getElementById("brandName").textContent = state.person || "Personal Tracker";
    var derived = computeDerived();
    lastDerived = derived;
    renderAccountCards(derived);
    renderBuckets(derived);
    renderEntitlementPanel(derived);
    renderExpensesSummary(derived);
    renderDebtSummary(derived);
    renderDebts(derived);
    renderInstallmentSummary(derived);
    renderInstallments(derived);
    renderLedger();
    renderExpensesLedger();
    renderDebtLedger();
    renderInstallmentLedger();
    var fab = document.getElementById("fabBtn");
    fab.disabled = !state.accounts.length || !state.buckets.length;
    fab.title = fab.disabled ? "Configure Settings first" : "Add transaction";
  }

  // Beneficiary accounts (money tracked on someone else's behalf - Maryam,
  // Jawaher, whoever) exist purely for bookkeeping (selectable wherever a
  // bank account is picked, e.g. accountOptions()) but never appear on the
  // main dashboard - mirrors the company tracker's own accountTypeLabel()
  // split (only type "company" shows in ITS top stats row).
  function isPersonalAccount(a) { return (a.type || "personal") === "personal"; }

  function renderAccountCards(derived) {
    var el = document.getElementById("statsRow");
    var personalAccounts = state.accounts.filter(isPersonalAccount);
    if (!personalAccounts.length) { el.innerHTML = '<div class="empty-state" style="flex:1 1 100%">No personal bank accounts yet. Add one in Settings.</div>'; return; }
    var total = personalAccounts.reduce(function (s, a) { return s + derived.accountBalances[a.id]; }, 0);
    var cardsHtml = personalAccounts.map(function (a) {
      return '<div class="stat"><div class="label">' + esc(a.name) + '</div>' +
        '<div class="value num">' + curr() + ' ' + fmt(derived.accountBalances[a.id]) + '</div></div>';
    }).join("");
    el.innerHTML = '<div class="stats-row-accounts">' + cardsHtml + '</div>' +
      '<div class="stat total"><div class="label">' +
        '<span class="total-label-full">Total across bank accounts</span>' +
        '<span class="total-label-short">TOTAL <span class="total-note">— across bank accounts</span></span>' +
      '</div><div class="value num">' + curr() + ' ' + fmt(total) + '</div></div>';
  }

  function bucketLinkedCaption(b) {
    var linkedAcct = b.linkedAccountId ? accountById(b.linkedAccountId) : (state.defaultAccountId ? accountById(state.defaultAccountId) : null);
    var isDefault = !b.linkedAccountId;
    return '<div class="bucket-caption">' + (linkedAcct ? "→ " + esc(linkedAcct.name) + (isDefault ? " (default)" : "") : "No bank account set") + '</div>';
  }

  function buildBucketCardHtml(b, derived) {
    var i = bucketIndex(b.id);
    var hue = bucketColor(i);
    var balance = derived.bucketBalances[b.id] || 0;
    return (
      '<div class="bucket-card" style="--bucket-color:var(--' + hue + ');--bucket-soft:var(--' + hue + '-soft)">' +
        '<div class="bucket-name">' + esc(b.name) + '</div>' +
        '<div class="bucket-balance num">' + fmt(balance) + '</div>' +
        '<div class="bucket-caption">' + (Number(b.cap) || 0) + '% share</div>' +
        bucketLinkedCaption(b) +
      '</div>'
    );
  }

  function renderBuckets(derived) {
    var container = document.getElementById("bucketGrid");
    if (!state.buckets.length) {
      container.innerHTML = '<div class="empty-state">No Buckets configured. Add some in Settings.</div>';
      return;
    }
    // Column count tracks the real number of Accounts (capped at the same
    // 4/5 breakpoint widths the company tracker uses) so a handful of cards
    // stretch to fill the row instead of leaving a gap where a 5th/6th
    // column would be - a 6th+ Account wraps to a new row, same as there.
    var colsSm = Math.min(state.buckets.length, 4) || 1;
    var colsLg = Math.min(state.buckets.length, 5) || 1;
    container.innerHTML = '<div class="bucket-grid" style="--bucket-cols-sm:' + colsSm + ';--bucket-cols-lg:' + colsLg + '">' + state.buckets.map(function (b) { return buildBucketCardHtml(b, derived); }).join("") + '</div>';
  }

  function progressPanelHtml(title, received, monthly, extraClass) {
    var remaining = round2(monthly - received);
    var pct = monthly > 0 ? Math.max(0, Math.min(100, (received / monthly) * 100)) : 0;
    return '<div class="' + (extraClass || "panel") + '">' +
      '<div class="comp-title">' + esc(title) + ' <span class="sub">' + curr() + ' ' + fmt(received) + ' / ' + curr() + ' ' + fmt(monthly) + '</span></div>' +
      '<div class="progress"><div class="progress-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="bucket-caption" style="margin-top:6px">Remaining: ' + curr() + ' ' + fmt(remaining) + '</div>' +
    '</div>';
  }

  function renderEntitlementPanel(derived) {
    var el = document.getElementById("entitlementPanel");
    var sources = state.incomeSources;
    var totalMonthly = round2(sources.reduce(function (s, src) { return s + monthlyEquivalentAmount(src.amount, src.frequency); }, 0));
    if (!sources.length || !totalMonthly) { el.innerHTML = '<div class="empty-state">No income amount set. Add one in Settings.</div>'; return; }

    if (sources.length === 1) {
      var only = sources[0];
      el.innerHTML = progressPanelHtml("This month", derived.receivedBySource[only.id] || 0, monthlyEquivalentAmount(only.amount, only.frequency));
      return;
    }

    // Per-source rows show each one's raw cadence and its contribution to the
    // combined monthly total above — not a per-source received/remaining
    // tracker, which would be misleading for anything non-monthly (a
    // quarterly source looks "0 received" for two months out of three even
    // though nothing is actually wrong). Received-vs-remaining lives once,
    // at the combined total, where "this month" genuinely means something.
    var totalReceived = round2(sources.reduce(function (s, src) { return s + (derived.receivedBySource[src.id] || 0); }, 0));
    var html = progressPanelHtml("This month — all sources", totalReceived, totalMonthly);
    html += '<div class="item-list" style="margin-top:8px">' + sources.map(function (src) {
      var monthlyEquiv = monthlyEquivalentAmount(src.amount, src.frequency);
      var freq = src.frequency || "Undefined";
      var caption = freq === "Monthly" ? "Monthly" : freq + " · " + curr() + " " + fmt(src.amount || 0) + " per period";
      return '<div class="item-card"><div class="item-top">' +
        '<div><div class="item-name">' + esc(src.name) + '</div><div class="item-sub">' + caption + '</div></div>' +
        '<div class="item-amt num">' + curr() + ' ' + fmt(monthlyEquiv) + '/mo</div>' +
      '</div></div>';
    }).join("") + '</div>';
    el.innerHTML = html;
  }

  var expenseBreakdownChart = null;
  // Modeled on Prudy's original personal-finances-tracker artifact's
  // "Expenses breakdown" card (a doughnut over a per-Bucket legend) -
  // scoped to the current calendar month, matching the "This month"
  // convention the Income panel above already uses. Historical expenses
  // are excluded since they don't touch any Bucket balance (same reasoning
  // renderLedgerItem uses for them), so they'd misrepresent a Bucket
  // breakdown built on top of them.
  function renderExpensesSummary(derived) {
    var el = document.getElementById("expensesSummary");
    var targetMonth = todayStr().slice(0, 7);
    var monthExpenses = state.transactions.filter(function (t) {
      return t.type === "expense" && !t.historical && (t.date || "").slice(0, 7) === targetMonth;
    });
    if (!monthExpenses.length) {
      el.innerHTML = '<div class="panel" style="margin-bottom:8px">' +
        '<div class="comp-title">Expenses breakdown <span class="sub">This month</span></div>' +
        '<div class="empty-state">No expenses logged this month.</div>' +
      '</div>';
      return;
    }

    var byBucket = {};
    monthExpenses.forEach(function (t) {
      var key = t.bucketId || "_uncategorized";
      byBucket[key] = round2((byBucket[key] || 0) + (Number(t.amount) || 0));
    });
    var total = round2(Object.keys(byBucket).reduce(function (s, k) { return s + byBucket[k]; }, 0));
    var rows = state.buckets.map(function (b, i) {
      return { name: b.name, hue: bucketColor(i), amount: byBucket[b.id] || 0 };
    }).filter(function (r) { return r.amount > 0; });
    if (byBucket._uncategorized) rows.push({ name: "Uncategorized", hue: "clay", amount: byBucket._uncategorized });

    var legendHtml = rows.map(function (r) {
      var pct = total > 0 ? round2((r.amount / total) * 100) : 0;
      return '<div class="expense-legend-row">' +
        '<span class="name"><span class="dot" style="background:var(--' + r.hue + ')"></span>' + esc(r.name) + '</span>' +
        '<span class="pctval" style="color:var(--' + r.hue + ')">' + pct.toFixed(1) + '% · ' + fmt(r.amount) + '</span>' +
      '</div>';
    }).join("");

    el.innerHTML = '<div class="panel" style="margin-bottom:8px">' +
      '<div class="comp-title">Expenses breakdown <span class="sub">This month · ' + curr() + ' ' + fmt(total) + '</span></div>' +
      '<div class="expense-breakdown-row">' +
        '<div class="expense-chart-box"><canvas id="expenseBreakdownChart"></canvas></div>' +
        '<div class="expense-legend">' + legendHtml + '</div>' +
      '</div>' +
      '<div class="bucket-caption" style="margin-top:8px">' + monthExpenses.length + ' expense' + (monthExpenses.length === 1 ? "" : "s") + ' this month · click for the log</div>' +
    '</div>';

    if (expenseBreakdownChart) { expenseBreakdownChart.destroy(); expenseBreakdownChart = null; }
    if (window.Chart) {
      var canvas = document.getElementById("expenseBreakdownChart");
      var css = getComputedStyle(document.documentElement);
      expenseBreakdownChart = new Chart(canvas, {
        type: "doughnut",
        data: {
          labels: rows.map(function (r) { return r.name; }),
          datasets: [{
            data: rows.map(function (r) { return r.amount; }),
            backgroundColor: rows.map(function (r) { return css.getPropertyValue("--" + r.hue).trim(); }),
            borderWidth: 2,
            borderColor: css.getPropertyValue("--surface").trim()
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "65%",
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  var val = ctx.parsed;
                  var pct = total > 0 ? (val / total * 100).toFixed(1) : "0.0";
                  return ctx.label + ": " + pct + "% (" + curr().replace(/<[^>]+>/g, "") + " " + fmt(val) + ")";
                }
              }
            }
          }
        }
      });
    }
  }

  function renderExpensesLedger() {
    renderFilteredLedger("expensesLedgerSection", null, function (t) { return t.type === "expense"; }, "No expenses logged yet.", false);
  }

  function renderDebtSummary(derived) {
    var el = document.getElementById("debtSummary");
    if (!state.debts.length) { el.innerHTML = ""; return; }
    // Net personal position, same concept as Prudy's original artifact card:
    // owed-to-you balances minus owed-by-you balances, summed across every
    // debt on file (kept generic — the original's specific exclusions, like
    // "company owes Maryam is informational only," were Albaiti-specific
    // judgment calls, not a formula to replicate). Stays visible even when
    // the detail list below is collapsed - same pattern as Prudy's artifact,
    // where the summary card never hides, only the itemized breakdown does.
    var net = 0;
    state.debts.forEach(function (deb) {
      var bal = derived.debtBalances[deb.id] || 0;
      net = round2(net + (deb.direction === "owed_by_me" ? -bal : bal));
    });
    el.innerHTML = '<div class="panel" style="margin-bottom:8px">' +
      '<div class="comp-title">Net personal position</div>' +
      '<div class="bucket-balance num' + (net < 0 ? " neg" : "") + '" style="' + (net < 0 ? "color:var(--danger)" : "color:var(--accent)") + '">' + curr() + ' ' + fmt(net) + '</div>' +
      '<div class="bucket-caption">' + state.debts.length + ' item' + (state.debts.length === 1 ? "" : "s") + ' · click to see the breakdown</div>' +
      '</div>';
  }

  function renderDebts(derived) {
    var el = document.getElementById("debtSection");
    if (!state.debts.length) { el.innerHTML = '<div class="empty-state">No debts tracked. Add some in Settings.</div>'; return; }
    el.innerHTML = '<div class="bucket-section-title">Debts</div><div class="item-list">' + state.debts.map(function (deb) {
      var bal = derived.debtBalances[deb.id] || 0;
      var isOwedByMe = deb.direction === "owed_by_me";
      var dirLabel = isOwedByMe ? "You owe" : "Owed to you";
      // A debt "you owe" is a liability regardless of how the raw balance's
      // own sign happens to fall out of its increase/decrease entries — its
      // card should read as red/negative, matching the Net personal position
      // panel above (which already applies this same direction-based flip).
      return '<div class="item-card"><div class="item-top">' +
        '<div><div class="item-name">' + esc(deb.name) + '</div><div class="item-sub">' + dirLabel + '</div></div>' +
        '<div class="item-amt ' + (isOwedByMe ? "neg" : "pos") + ' num">' + curr() + ' ' + fmt(bal) + '</div>' +
      '</div></div>';
    }).join("") + "</div>";
  }

  function renderInstallmentSummary(derived) {
    var el = document.getElementById("installmentSummary");
    if (!state.installments.length) { el.innerHTML = ""; return; }
    var totalMonthly = round2(state.installments.reduce(function (s, i) { return s + (Number(i.monthlyAmount) || 0); }, 0));
    var totalRemaining = round2(state.installments.reduce(function (s, i) { return s + (derived.installmentBalances[i.id] || 0); }, 0));
    el.innerHTML = '<div class="panel" style="margin-bottom:8px">' +
      '<div class="comp-title">Total monthly obligation <span class="sub">' + curr() + ' ' + fmt(totalMonthly) + '/mo</span></div>' +
      '<div class="bucket-caption">' + state.installments.length + ' item' + (state.installments.length === 1 ? "" : "s") + ' · Total remaining ' + curr() + ' ' + fmt(totalRemaining) + ' · click for the breakdown</div>' +
      '</div>';
  }

  // Adds `months` to today and returns a short "Mon YYYY" label - used to
  // turn "installments left" (already a monthly-cadence count) into a real
  // estimated payoff date, without needing any new data field.
  function estimatedPayoffLabel(months) {
    if (!months || months <= 0) return "";
    var d = new Date();
    d.setMonth(d.getMonth() + months);
    var names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return names[d.getMonth()] + " " + d.getFullYear();
  }

  // One segment per installment: the first `paid` are green, the next
  // `late` (the ones immediately due after the last real payment) are red,
  // and whatever's left is yellow (due later, not yet late). There's no
  // per-installment due-date data, so "which ones are late" is inferred as
  // the earliest unpaid ones, not a specific tracked date.
  // Multi-year schedules (e.g. 60 months) would render as near-invisible
  // slivers and mostly just show grey noise past the near-term window - so
  // long bars show a ~1-year (12-segment) window centered on the active
  // boundary (recent paid/late history + the one due next), with a small
  // "+N" marker on whichever side got cut off. The "X/Y paid" caption below
  // still states the real, un-windowed total, so nothing is hidden, just
  // not all rendered as individual slivers.
  var SEGBAR_WINDOW = 12;

  function buildInstallmentSegBar(total, paid, late, isMonthly) {
    var active = paid + late; // index of the "due" segment, or the boundary if none
    var start = 0, end = total;
    if (total > SEGBAR_WINDOW) {
      start = active - Math.floor(SEGBAR_WINDOW / 2);
      end = start + SEGBAR_WINDOW;
      if (start < 0) { start = 0; end = SEGBAR_WINDOW; }
      if (end > total) { end = total; start = total - SEGBAR_WINDOW; }
    }
    // Segment width is fixed CSS-side as 1/12th of the bar's row width
    // (SEGBAR_WINDOW caps visible segments at 12), so a full 12-segment
    // bar spans the whole card and every other bar uses that same
    // per-segment size, just running shorter.
    var segs = [];
    for (var i = start; i < end; i++) {
      // The single next payment right after paid/late is only "due" for a
      // real monthly-cadence loan - the next one being right after in the
      // count doesn't mean it's due now for something like an annual
      // payment (monthlyAmount 0 is the signal for that), so it just stays
      // unclassed (grey) like the rest of the un-due future there.
      var cls = i < paid ? "paid" : (i < paid + late ? "late" : (isMonthly && i === paid + late ? "due" : ""));
      segs.push('<div class="' + cls + '"></div>');
    }
    var before = start > 0 ? '<span class="segbar-more">+' + start + '</span>' : "";
    var after = end < total ? '<span class="segbar-more">+' + (total - end) + '</span>' : "";
    return '<div class="segbar-row">' + before + '<div class="segbar">' + segs.join("") + '</div>' + after + '</div>';
  }

  function renderInstallments(derived) {
    var el = document.getElementById("installmentSection");
    if (!state.installments.length) { el.innerHTML = '<div class="empty-state">No installments tracked. Add some in Settings.</div>'; return; }

    var lateOnes = state.installments.filter(function (i) { return (Number(i.lateCount) || 0) > 0; });
    var lateNote = lateOnes.length
      ? '<div class="ledger-note" style="margin-bottom:10px">' + lateOnes.length + ' of ' + state.installments.length +
        ' loan' + (state.installments.length === 1 ? "" : "s") + ' ' + (lateOnes.length === 1 ? "has" : "have") + ' at least one late installment: ' +
        lateOnes.map(function (i) { return esc(i.name) + ' (' + (Number(i.lateCount) || 0) + '/' + (i.installmentsTotal || "?") + ')'; }).join(", ") + '.</div>'
      : "";

    el.innerHTML = lateNote + '<div class="item-list">' + state.installments.map(function (inst) {
      var bal = derived.installmentBalances[inst.id] || 0;
      var total = Number(inst.installmentsTotal) || 0;
      var left = Number(inst.installmentsLeft) || 0;
      var late = Number(inst.lateCount) || 0;
      var hasSchedule = total > 0;
      var isMonthly = (Number(inst.monthlyAmount) || 0) > 0;
      var paid = hasSchedule ? Math.max(0, total - left) : 0;
      var pct = hasSchedule ? Math.max(0, Math.min(100, (paid / total) * 100)) : 0;
      // Same reasoning as the segment bar's "due" flag: "installments left"
      // only converts cleanly into a calendar estimate for a real monthly
      // cadence - for something like an annual payment, guessing a monthly
      // countdown would just be wrong, so it's omitted rather than shown.
      var trailer = "";
      if (left <= 0) trailer = " · paid off";
      else if (isMonthly) {
        var payoff = estimatedPayoffLabel(left);
        if (payoff) trailer = " · est. payoff " + payoff;
      }

      var progressHtml = hasSchedule
        ? buildInstallmentSegBar(total, paid, late, isMonthly) +
          '<div class="bucket-caption" style="margin-top:5px">' + paid + '/' + total + ' paid (' + pct.toFixed(0) + '%)' + trailer + '</div>'
        : '<div class="bucket-caption" style="margin-top:6px">Ongoing — no fixed end date</div>';

      var chips = [];
      if (late) chips.push('<span class="chip emergency">' + late + (hasSchedule ? "/" + total : "") + ' late</span>');
      if (inst.balloon) chips.push('<span class="chip">Balloon ' + curr() + ' ' + fmt(inst.balloon) + '</span>');
      var chipRow = chips.length ? '<div class="chip-row" style="margin-top:6px">' + chips.join("") + '</div>' : "";

      return '<div class="item-card"' + (late ? ' style="border-left:3px solid var(--clay)"' : '') + '>' +
        '<div class="item-top">' +
          '<div><div class="item-name">' + esc(inst.name) + '</div><div class="item-sub">' + esc(inst.purpose || "") + '</div></div>' +
          '<div class="item-amt num">' + curr() + ' ' + fmt(bal) + '</div>' +
        '</div>' +
        '<div class="bucket-caption">' + curr() + ' ' + fmt(inst.monthlyAmount || 0) + '/mo</div>' +
        progressHtml + chipRow +
      '</div>';
    }).join("") + "</div>";
  }

  /* ---------------- ledger ---------------- */
  function txTypeLabel(t) { return { draw: "Inflow", expense: "Expense", debt_entry: "Debt entry", installment_payment: "Installment payment", opening_balance: "Opening balance" }[t.type] || t.type; }

  function renderLedgerItem(tx) {
    var isIn = tx.type === "draw" || tx.type === "opening_balance";
    var isOut = tx.type === "expense";
    var signedAmt = (tx.type === "debt_entry" || tx.type === "installment_payment") ? tx.amount : (isOut ? -tx.amount : tx.amount);
    var amtClass = signedAmt >= 0 ? "pos" : "";
    if (signedAmt < 0) amtClass = "neg";
    var amtSign = signedAmt >= 0 ? "+" : "−";
    var chips = "", note = "";

    if (tx.type === "draw") {
      var srcName = "";
      if (state.incomeSources.length > 1) {
        var src = incomeSourceById(tx.sourceId);
        srcName = src ? " (" + esc(src.name) + ")" : "";
      }
      if (tx.historical) {
        var inflowTypeLabel = inflowTypeOf(tx);
        chips = '<div class="chip-row"><span class="chip historical">' + esc(inflowTypeLabel) + ' — record only</span></div>';
        var acctHist = accountById(tx.accountId);
        note = (inflowTypeLabel === "Historical" ? "Predates the Bucket-split system" : inflowTypeLabel + ", not earned income") + " — lands in " + (acctHist ? esc(acctHist.name) : "(deleted account)") + " but isn't split across Buckets, and doesn't count toward the income entitlement." + srcName;
      } else if (tx.emergency) {
        chips = '<div class="chip-row"><span class="chip emergency">Emergency — entitlement only</span></div>';
        note = "Doesn't land in a bank account and doesn't split across Buckets." + srcName;
      } else {
        var acct = accountById(tx.accountId);
        chips = '<div class="chip-row">' + Object.keys(tx.split || {}).map(function (bid) {
          var b = bucketById(bid); if (!b) return "";
          var hue = bucketColor(bucketIndex(bid));
          return '<span class="chip" style="--chip-soft:var(--' + hue + '-soft);--chip-color:var(--' + hue + ')">' + esc(b.name) + ' ' + fmt(tx.split[bid]) + '</span>';
        }).join("") + '</div>';
        note = "Into " + (acct ? esc(acct.name) : "(deleted account)") + ", split across Buckets" + srcName;
      }
    } else if (tx.type === "expense") {
      var b2 = bucketById(tx.bucketId);
      var acct2 = accountById(tx.accountId);
      if (tx.historical) {
        chips = '<div class="chip-row"><span class="chip historical">Historical — record only</span></div>';
        note = "Predates " + (acct2 ? esc(acct2.name) : "the account") + "'s current opening balance, which already reflects it — record only, doesn't reduce its Bucket or change any balance.";
      } else {
        if (b2) {
          var hue2 = bucketColor(bucketIndex(tx.bucketId));
          chips = '<div class="chip-row"><span class="chip" style="--chip-soft:var(--' + hue2 + '-soft);--chip-color:var(--' + hue2 + ')">' + esc(b2.name) + '</span></div>';
        }
        note = "From " + (acct2 ? esc(acct2.name) : "(deleted account)");
      }
    } else if (tx.type === "debt_entry") {
      var deb = debtById(tx.debtId);
      note = deb ? esc(deb.name) : "(deleted debt)";
      if (tx.accountId) {
        var debAcct = accountById(tx.accountId);
        note += " · " + (debAcct ? "via " + esc(debAcct.name) : "(deleted account)");
      }
    } else if (tx.type === "installment_payment") {
      var inst = installmentById(tx.installmentId);
      note = inst ? esc(inst.name) : "(deleted installment)";
      if (tx.accountId) {
        var instAcct = accountById(tx.accountId);
        note += " · " + (instAcct ? "via " + esc(instAcct.name) : "(deleted account)");
      }
      if (tx.late) chips = '<div class="chip-row"><span class="chip emergency">Late</span></div>';
    } else if (tx.type === "opening_balance") {
      var acct3 = accountById(tx.accountId);
      chips = '<div class="chip-row">' + Object.keys(tx.allocation || {}).map(function (bid) {
        var b3 = bucketById(bid); if (!b3) return "";
        var hue3 = bucketColor(bucketIndex(bid));
        return '<span class="chip" style="--chip-soft:var(--' + hue3 + '-soft);--chip-color:var(--' + hue3 + ')">' + esc(b3.name) + ' ' + fmt(tx.allocation[bid]) + '</span>';
      }).join("") + '</div>';
      note = "Into " + (acct3 ? esc(acct3.name) : "(deleted account)");
    }

    var actions = (tx.opening ? "" : '<button class="link-btn" data-action="edit" data-id="' + tx.id + '">Edit</button>') +
      '<button class="link-btn danger" data-action="delete" data-id="' + tx.id + '">Delete</button>';

    return (
      '<div class="ledger-item">' +
        '<div class="ledger-top">' +
          '<div><div class="ledger-desc">' + esc(tx.description || "(no description)") + " <span style=\"font-weight:400;color:var(--text-muted);\">· " + txTypeLabel(tx) + '</span></div><div class="ledger-date">' + esc(tx.date) + '</div></div>' +
          '<div class="ledger-amt num ' + amtClass + '">' + curr() + ' ' + amtSign + fmt(Math.abs(signedAmt)) + '</div>' +
        '</div>' +
        chips +
        '<div class="ledger-note">' + note + '</div>' +
        '<div class="ledger-actions">' + actions + '</div>' +
      '</div>'
    );
  }

  // A split expense (submitTx()'s split branch) is still N ordinary
  // transactions underneath - computeDerived(), edit/delete, filtering all
  // work on them exactly as if they were unrelated expenses, each with its
  // own Edit/Delete, unchanged. This only groups ADJACENT rows sharing a
  // splitGroupId for LAYOUT - rendered side by side in one row instead of
  // stacked - via renderLedgerItem() exactly as-is, just wrapped. A sort
  // where they land next to each other (date sort - the common case, since
  // they share a date and near-identical createdAt) puts them in one row;
  // under amount sort they can land apart (different amounts) and just
  // render individually - no special-casing needed since grouping only
  // combines rows already adjacent in the given order.
  function groupAdjacentSplits(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var tx = list[i];
      if (tx.splitGroupId) {
        var group = [tx];
        while (i + 1 < list.length && list[i + 1].splitGroupId === tx.splitGroupId) { group.push(list[++i]); }
        out.push(group.length > 1 ? { kind: "split", rows: group } : { kind: "single", tx: tx });
      } else {
        out.push({ kind: "single", tx: tx });
      }
    }
    return out;
  }

  function renderSplitLedgerGroup(rows) {
    return '<div class="split-card-row">' + rows.map(renderLedgerItem).join("") + '</div>';
  }

  // Three separate transaction lists, not one - Ledger is cash flow
  // (draw/expense/opening_balance) PLUS any debt_entry/installment_payment
  // that actually moved real cash through one of my own accounts
  // (tx.accountId set) - a debt/installment entry with no accountId is a
  // ledger-only record (nothing left a tracked account) and stays out of
  // the main Ledger, visible only in its own Debt/Installment section.
  // Debt and Installments each ALSO get their own history of every one of
  // their own entries regardless of accountId, so nothing is ever hidden,
  // just not double-shown unless it's a real account-level cash move. All
  // three reuse the same renderLedgerItem() row AND the same search/sort/
  // filter mechanism (ported from the company tracker's ledgerFilter/
  // tracker.html), so formatting and behavior stay identical everywhere -
  // each section just gets its own filter state (keyed by idPrefix) and a
  // leaner filter bar for Debt/Installment (no type/bucket dropdowns,
  // since those sections are always one fixed type with no bucket concept).
  function txInMainLedger(t) {
    if (t.type === "draw" || t.type === "expense" || t.type === "opening_balance") return true;
    if (t.type === "debt_entry" || t.type === "installment_payment") return !!t.accountId;
    return false;
  }

  var ledgerFilters = {};
  function ledgerFilterState(idPrefix) {
    if (!ledgerFilters[idPrefix]) {
      ledgerFilters[idPrefix] = { search: "", type: "", bucketId: "", accountId: "", dateFrom: "", dateTo: "", amountMin: "", amountMax: "", sortBy: "date-desc" };
    }
    return ledgerFilters[idPrefix];
  }

  function ledgerTxTouchesBucket(tx, bucketId) {
    if (tx.type === "draw") return !!(tx.split && tx.split.hasOwnProperty(bucketId));
    if (tx.type === "expense") return tx.bucketId === bucketId;
    if (tx.type === "opening_balance") return !!(tx.allocation && tx.allocation.hasOwnProperty(bucketId));
    return false;
  }
  function ledgerTxTouchesAccount(tx, accountId) {
    if (tx.type === "draw" || tx.type === "expense" || tx.type === "opening_balance" || tx.type === "debt_entry" || tx.type === "installment_payment") return tx.accountId === accountId;
    return false;
  }
  function ledgerSearchText(tx) {
    var bits = [tx.description || "", tx.type || "", tx.date || ""];
    if (tx.type === "draw") {
      Object.keys(tx.split || {}).forEach(function (bid) { var b = bucketById(bid); if (b) bits.push(b.name); });
      var a = accountById(tx.accountId); if (a) bits.push(a.name);
      var src = incomeSourceById(tx.sourceId); if (src) bits.push(src.name);
      bits.push(inflowTypeOf(tx));
    } else if (tx.type === "expense") {
      var b2 = bucketById(tx.bucketId); if (b2) bits.push(b2.name);
      var a2 = accountById(tx.accountId); if (a2) bits.push(a2.name);
    } else if (tx.type === "opening_balance") {
      var a3 = accountById(tx.accountId); if (a3) bits.push(a3.name);
      Object.keys(tx.allocation || {}).forEach(function (bid) { var b3 = bucketById(bid); if (b3) bits.push(b3.name); });
    } else if (tx.type === "debt_entry") {
      var deb = debtById(tx.debtId); if (deb) bits.push(deb.name);
      var a4 = accountById(tx.accountId); if (a4) bits.push(a4.name);
    } else if (tx.type === "installment_payment") {
      var inst = installmentById(tx.installmentId); if (inst) bits.push(inst.name);
      var a5 = accountById(tx.accountId); if (a5) bits.push(a5.name);
    }
    return bits.join(" ").toLowerCase();
  }
  function ledgerFiltersActive(f) {
    return !!(f.search || f.type || f.bucketId || f.accountId || f.dateFrom || f.dateTo || f.amountMin !== "" || f.amountMax !== "");
  }
  function matchesLedgerFilter(tx, f) {
    if (f.search && ledgerSearchText(tx).indexOf(f.search.toLowerCase()) === -1) return false;
    if (f.type && tx.type !== f.type) return false;
    if (f.bucketId && !ledgerTxTouchesBucket(tx, f.bucketId)) return false;
    if (f.accountId && !ledgerTxTouchesAccount(tx, f.accountId)) return false;
    if (f.dateFrom && tx.date < f.dateFrom) return false;
    if (f.dateTo && tx.date > f.dateTo) return false;
    if (f.amountMin !== "" && Math.abs(tx.amount) < parseFloat(f.amountMin)) return false;
    if (f.amountMax !== "" && Math.abs(tx.amount) > parseFloat(f.amountMax)) return false;
    return true;
  }
  function sortedFilteredLedger(txs, f) {
    var filtered = txs.filter(function (tx) { return matchesLedgerFilter(tx, f); });
    filtered.sort(function (a, b) {
      if (f.sortBy === "amount-desc") return Math.abs(b.amount) - Math.abs(a.amount);
      if (f.sortBy === "amount-asc") return Math.abs(a.amount) - Math.abs(b.amount);
      if (f.sortBy === "date-asc") {
        if (a.date === b.date) return (a.createdAt || 0) - (b.createdAt || 0);
        return a.date < b.date ? -1 : 1;
      }
      if (a.date === b.date) return (b.createdAt || 0) - (a.createdAt || 0);
      return a.date < b.date ? 1 : -1;
    });
    return filtered;
  }
  function ledgerFilterBarHtml(idPrefix, f, showTypeBucketAccount) {
    var active = ledgerFiltersActive(f);
    return (
      '<div class="ledger-filter-bar">' +
        '<input class="input" id="' + idPrefix + 'Search" type="search" placeholder="Search description, Bucket, bank account…" value="' + esc(f.search) + '">' +
        '<details class="ledger-filters-details"' + (active ? " open" : "") + '>' +
          '<summary>Sort &amp; filter <span class="filter-badge" id="' + idPrefix + 'FilterBadge" style="' + (active ? "" : "display:none") + '">active</span></summary>' +
          '<div class="field"><label>Sort by</label><select class="select" id="' + idPrefix + 'Sort">' +
            '<option value="date-desc"' + (f.sortBy === "date-desc" ? " selected" : "") + '>Date (newest first)</option>' +
            '<option value="date-asc"' + (f.sortBy === "date-asc" ? " selected" : "") + '>Date (oldest first)</option>' +
            '<option value="amount-desc"' + (f.sortBy === "amount-desc" ? " selected" : "") + '>Amount (high to low)</option>' +
            '<option value="amount-asc"' + (f.sortBy === "amount-asc" ? " selected" : "") + '>Amount (low to high)</option>' +
          '</select></div>' +
          (showTypeBucketAccount ? (
            '<div class="row2">' +
              '<div class="field"><label>Type</label><select class="select" id="' + idPrefix + 'TypeFilter">' +
                '<option value=""' + (!f.type ? " selected" : "") + '>All types</option>' +
                '<option value="draw"' + (f.type === "draw" ? " selected" : "") + '>Inflow</option>' +
                '<option value="expense"' + (f.type === "expense" ? " selected" : "") + '>Expense</option>' +
                '<option value="opening_balance"' + (f.type === "opening_balance" ? " selected" : "") + '>Opening balance</option>' +
              '</select></div>' +
              '<div class="field"><label>Bucket</label><select class="select" id="' + idPrefix + 'BucketFilter">' +
                '<option value="">All Buckets</option>' +
                state.buckets.map(function (b) { return '<option value="' + b.id + '"' + (f.bucketId === b.id ? " selected" : "") + '>' + esc(b.name) + '</option>'; }).join("") +
              '</select></div>' +
            '</div>' +
            '<div class="field"><label>Bank account</label><select class="select" id="' + idPrefix + 'AccountFilter">' +
              '<option value="">All bank accounts</option>' +
              state.accounts.map(function (a) { return '<option value="' + a.id + '"' + (f.accountId === a.id ? " selected" : "") + '>' + esc(a.name) + '</option>'; }).join("") +
            '</select></div>'
          ) : "") +
          '<div class="row2">' +
            '<div class="field"><label>From date</label><input class="input" type="date" id="' + idPrefix + 'DateFrom" value="' + esc(f.dateFrom) + '"></div>' +
            '<div class="field"><label>To date</label><input class="input" type="date" id="' + idPrefix + 'DateTo" value="' + esc(f.dateTo) + '"></div>' +
          '</div>' +
          '<div class="row2">' +
            '<div class="field"><label>Min amount</label><input class="input" type="number" step="0.01" id="' + idPrefix + 'AmountMin" value="' + esc(f.amountMin) + '" placeholder="0.00"></div>' +
            '<div class="field"><label>Max amount</label><input class="input" type="number" step="0.01" id="' + idPrefix + 'AmountMax" value="' + esc(f.amountMax) + '" placeholder="0.00"></div>' +
          '</div>' +
          '<button class="link-btn" id="' + idPrefix + 'ClearFilters" style="' + (active ? "" : "display:none") + '">Clear all filters</button>' +
        '</details>' +
      '</div>'
    );
  }

  function renderFilteredLedger(elId, countElId, predicate, emptyMsg, showTypeBucketAccount) {
    var idPrefix = elId;
    var f = ledgerFilterState(idPrefix);
    var el = document.getElementById(elId);
    var countEl = countElId ? document.getElementById(countElId) : null;
    var allTxs = state.transactions.filter(predicate);

    function renderList() {
      var filtered = sortedFilteredLedger(allTxs, f);
      var active = ledgerFiltersActive(f);
      if (countEl) countEl.textContent = allTxs.length ? (active ? "(" + filtered.length + " of " + allTxs.length + ")" : "(" + allTxs.length + ")") : "";
      var badgeEl = document.getElementById(idPrefix + "FilterBadge");
      if (badgeEl) badgeEl.style.display = active ? "" : "none";
      var clearBtnEl = document.getElementById(idPrefix + "ClearFilters");
      if (clearBtnEl) clearBtnEl.style.display = active ? "" : "none";
      var wrap = document.getElementById(idPrefix + "ListWrap");
      if (!wrap) return;
      wrap.innerHTML = filtered.length
        ? '<div class="ledger-list">' + groupAdjacentSplits(filtered).map(function (g) { return g.kind === "split" ? renderSplitLedgerGroup(g.rows) : renderLedgerItem(g.tx); }).join("") + "</div>"
        : '<div class="empty-state">' + (allTxs.length ? "No transactions match your filters." : emptyMsg) + '</div>';
    }

    if (!allTxs.length) {
      if (countEl) countEl.textContent = "";
      el.innerHTML = '<div class="empty-state">' + emptyMsg + '</div>';
      return;
    }

    el.innerHTML = ledgerFilterBarHtml(idPrefix, f, showTypeBucketAccount) + '<div id="' + idPrefix + 'ListWrap"></div>';
    var bar = el.querySelector(".ledger-filter-bar");
    function on(id, evt, apply) {
      var input = bar.querySelector("#" + id);
      if (input) input.addEventListener(evt, function () { apply(input.value); renderList(); });
    }
    on(idPrefix + "Search", "input", function (v) { f.search = v; });
    on(idPrefix + "Sort", "change", function (v) { f.sortBy = v; });
    on(idPrefix + "TypeFilter", "change", function (v) { f.type = v; });
    on(idPrefix + "BucketFilter", "change", function (v) { f.bucketId = v; });
    on(idPrefix + "AccountFilter", "change", function (v) { f.accountId = v; });
    on(idPrefix + "DateFrom", "change", function (v) { f.dateFrom = v; });
    on(idPrefix + "DateTo", "change", function (v) { f.dateTo = v; });
    on(idPrefix + "AmountMin", "input", function (v) { f.amountMin = v; });
    on(idPrefix + "AmountMax", "input", function (v) { f.amountMax = v; });
    var clearBtn = bar.querySelector("#" + idPrefix + "ClearFilters");
    if (clearBtn) clearBtn.addEventListener("click", function () {
      ledgerFilters[idPrefix] = { search: "", type: "", bucketId: "", accountId: "", dateFrom: "", dateTo: "", amountMin: "", amountMax: "", sortBy: f.sortBy };
      renderFilteredLedger(elId, countElId, predicate, emptyMsg, showTypeBucketAccount);
    });

    renderList();
  }

  function renderLedger() {
    renderFilteredLedger("ledgerSection", "ledgerCount", txInMainLedger, "No transactions logged yet.", true);
  }

  function renderDebtLedger() {
    renderFilteredLedger("debtLedgerSection", null, function (t) { return t.type === "debt_entry"; }, "No debt entries logged yet.", false);
  }

  function renderInstallmentLedger() {
    renderFilteredLedger("installmentLedgerSection", null, function (t) { return t.type === "installment_payment"; }, "No installment payments logged yet.", false);
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  /* ---------------- confirm dialog (copied verbatim from the company tracker) ---------------- */
  function openConfirm(message, confirmLabel, danger) {
    return new Promise(function (resolve) {
      var overlay = document.getElementById("confirmOverlay");
      var sheet = document.getElementById("confirmSheet");
      sheet.innerHTML =
        '<div class="confirm-msg">' + esc(message) + '</div>' +
        '<div class="btn-row">' +
          '<button class="btn" id="confirmCancel">Cancel</button>' +
          '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" id="confirmOk">' + esc(confirmLabel || "Confirm") + '</button>' +
        '</div>';
      function close(result) { overlay.classList.remove("open"); resolve(result); }
      sheet.querySelector("#confirmCancel").onclick = function () { close(false); };
      sheet.querySelector("#confirmOk").onclick = function () { close(true); };
      overlay.onclick = function (e) { if (e.target === overlay) close(false); };
      overlay.classList.add("open");
    });
  }

  /* ---------------- icons (copied verbatim from the company tracker) ---------------- */
  function xIcon() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'; }
  function upIcon() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'; }
  function downIcon() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>'; }

  function moveAccount(id, dir) {
    var idx = state.accounts.findIndex(function (a) { return a.id === id; });
    if (idx === -1) return;
    var target = dir === "up" ? idx - 1 : idx + 1;
    if (target < 0 || target >= state.accounts.length) return;
    var tmp = state.accounts[idx];
    state.accounts[idx] = state.accounts[target];
    state.accounts[target] = tmp;
    persist(); renderSettingsSheet(); render();
  }

  /* ---------------- transaction sheet ---------------- */
  var txType = "draw";
  var editingTxId = null;
  function openTxSheet(type) { txType = type || "draw"; editingTxId = null; document.getElementById("txOverlay").classList.add("open"); renderTxSheet(); }
  function openEditTxSheet(tx) { txType = tx.type; editingTxId = tx.id; document.getElementById("txOverlay").classList.add("open"); renderTxSheet(); }
  function closeTxSheet() { editingTxId = null; document.getElementById("txOverlay").classList.remove("open"); }

  function accountOptions(selectedId) {
    return state.accounts.map(function (a) { return '<option value="' + a.id + '"' + (a.id === selectedId ? " selected" : "") + '>' + esc(a.name) + "</option>"; }).join("");
  }
  function bucketOptions(selectedId) {
    return state.buckets.map(function (b) { return '<option value="' + b.id + '"' + (b.id === selectedId ? " selected" : "") + '>' + esc(b.name) + "</option>"; }).join("");
  }
  function debtOptions(selectedId) {
    return state.debts.map(function (d) { return '<option value="' + d.id + '"' + (d.id === selectedId ? " selected" : "") + '>' + esc(d.name) + "</option>"; }).join("");
  }
  function installmentOptions(selectedId) {
    return state.installments.map(function (i) { return '<option value="' + i.id + '"' + (i.id === selectedId ? " selected" : "") + '>' + esc(i.name) + "</option>"; }).join("");
  }
  function incomeSourceOptions(selectedId) {
    return state.incomeSources.map(function (s) { return '<option value="' + s.id + '"' + (s.id === selectedId ? " selected" : "") + '>' + esc(s.name) + "</option>"; }).join("");
  }

  // Only "Income" counts toward the Owner's Pay entitlement and splits
  // across Buckets - every other Type behaves exactly like the old
  // "historical" checkbox did (lands in the account as real cash, no
  // split, no entitlement count). historical is still the field
  // computeDerived() actually reads - inflowType is a pure UI/display
  // categorization derived into it at submit time, so the balance math
  // never had to change.
  var INFLOW_TYPES = ["Income", "Gift", "Cash back", "Historical", "Other"];
  function inflowTypeOptions(selectedType) {
    return INFLOW_TYPES.map(function (t) { return '<option value="' + t + '"' + (t === selectedType ? " selected" : "") + '>' + t + "</option>"; }).join("");
  }
  function inflowTypeOf(tx) {
    if (tx.inflowType) return tx.inflowType;
    return tx.historical ? "Historical" : "Income";
  }
  function inflowTypeNote(type) {
    if (type === "Income") return "";
    var why = type === "Gift" ? "A gift, not earned income"
      : type === "Cash back" ? "Cash back, not earned income"
      : type === "Historical" ? "Predates the Bucket-split system (and entitlement tracking)"
      : "Not counted as earned income";
    return '<div class="check-note">' + why + " — still lands in the bank account as real cash, but doesn't split across Buckets and doesn't count toward the income entitlement.</div>";
  }

  // Ported from the company tracker's expense-split feature: rather than
  // one transaction carrying multiple accounts, a submit with the split
  // checkbox on fans out into N ordinary single-account expense
  // transactions (see submitTx()'s expense branch) - computeDerived()
  // needs no special case, each row is just a normal expense. Only offered
  // when creating a new expense, not editing one (editing a row from a
  // past split just edits that one row, same as the company tracker).
  var SPLIT_ROW_COUNT = 4;

  function splitAccountsSectionHtml(defaultAccountId) {
    var rows = "";
    for (var i = 0; i < SPLIT_ROW_COUNT; i++) {
      rows +=
        '<div class="row2 split-row" data-split-row' + (i >= 2 ? ' style="display:none"' : "") + '>' +
          '<select class="select" data-split-account>' + accountOptions(i === 0 ? defaultAccountId : null) + '</select>' +
          '<input class="input" type="number" step="0.01" placeholder="0.00" data-split-amount>' +
        '</div>';
    }
    return (
      '<label class="check-row"><input type="checkbox" id="txExpenseSplit"> Split across accounts</label>' +
      '<div class="check-note">Paid partly from two or more of my bank accounts instead of just one.</div>' +
      '<div id="txExpenseSplitWrap" style="display:none">' +
        rows +
        '<button type="button" class="link-btn" id="txExpenseSplitAdd">+ Add another account</button>' +
        '<div class="ledger-note" id="txExpenseSplitRemaining" style="margin-top:6px"></div>' +
      '</div>'
    );
  }

  function wireSplitSection(sheet) {
    var splitCheckbox = sheet.querySelector("#txExpenseSplit");
    var splitWrap = sheet.querySelector("#txExpenseSplitWrap");
    var accountField = sheet.querySelector("#txAccountField");
    var addBtn = sheet.querySelector("#txExpenseSplitAdd");
    var remainingEl = sheet.querySelector("#txExpenseSplitRemaining");
    var amountInput = sheet.querySelector("#txAmount");

    function updateRemaining() {
      var total = round2(parseFloat(amountInput.value) || 0);
      var rows = readSplitRows(sheet, total);
      var allocated = round2(rows.rows.reduce(function (s, r) { return s + r.amount; }, 0));
      var left = round2(total - allocated);
      if (Math.abs(left) <= 0.004) remainingEl.textContent = "Fully allocated.";
      else if (left > 0) remainingEl.textContent = curr_plain() + " " + fmt(left) + " left to allocate.";
      else remainingEl.textContent = curr_plain() + " " + fmt(Math.abs(left)) + " over the total amount.";
    }
    function curr_plain() { return state.currency; }

    splitCheckbox.addEventListener("change", function () {
      splitWrap.style.display = splitCheckbox.checked ? "" : "none";
      accountField.style.display = splitCheckbox.checked ? "none" : "";
      if (splitCheckbox.checked) updateRemaining();
    });
    addBtn.addEventListener("click", function () {
      var hiddenRow = Array.from(sheet.querySelectorAll("[data-split-row]")).filter(function (r) { return r.style.display === "none"; })[0];
      if (hiddenRow) hiddenRow.style.display = "";
      else showToast("Up to " + SPLIT_ROW_COUNT + " accounts.");
    });
    sheet.querySelectorAll("[data-split-amount]").forEach(function (inp) { inp.addEventListener("input", updateRemaining); });
    amountInput.addEventListener("input", function () { if (splitCheckbox.checked) updateRemaining(); });
  }

  function readSplitRows(sheet, totalAmount) {
    var rows = Array.from(sheet.querySelectorAll("[data-split-row]"))
      .filter(function (r) { return r.style.display !== "none"; })
      .map(function (r) {
        return { accountId: r.querySelector("[data-split-account]").value, amount: round2(parseFloat(r.querySelector("[data-split-amount]").value) || 0) };
      })
      .filter(function (r) { return r.amount > 0; });
    var sum = round2(rows.reduce(function (s, r) { return s + r.amount; }, 0));
    var valid = rows.length >= 2 && Math.abs(sum - totalAmount) <= 0.004;
    return { rows: rows, valid: valid };
  }

  function renderTxSheet() {
    var sheet = document.getElementById("txSheet");
    var editingTx = editingTxId ? state.transactions.find(function (t) { return t.id === editingTxId; }) : null;
    var types = [{ id: "draw", label: "Inflow" }, { id: "expense", label: "Expense" }, { id: "debt_entry", label: "Debt" }, { id: "installment_payment", label: "Installment" }];
    // Type can't change mid-edit (each type has its own field set) — show a
    // plain label instead of the switcher once editing an existing entry.
    var segmented = editingTx
      ? '<div class="ledger-note" style="margin-bottom:14px">Editing a ' + (types.filter(function (t) { return t.id === editingTx.type; })[0] || {}).label + ' transaction.</div>'
      : '<div class="segmented">' + types.map(function (t) {
          return '<button type="button" data-action="tx-type" data-type="' + t.id + '" class="' + (txType === t.id ? "active" : "") + '">' + t.label + "</button>";
        }).join("") + "</div>";

    var amountVal = editingTx ? round2(Math.abs(editingTx.amount)) : "";
    var descVal = editingTx ? esc(editingTx.description || "") : "";
    var dateVal = editingTx ? editingTx.date : todayStr();

    var fields = "";
    if (txType === "draw") {
      var sourceField = (state.incomeSources.length > 1)
        ? '<div class="field"><label>Income source</label><select class="select" id="txSource">' + incomeSourceOptions(editingTx ? editingTx.sourceId : defaultIncomeSourceId()) + "</select></div>"
        : "";
      var emergencyChecked = editingTx ? !!editingTx.emergency : false;
      var inflowTypeVal = editingTx ? inflowTypeOf(editingTx) : "Income";
      fields =
        '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" id="txAmount" placeholder="0.00" value="' + amountVal + '"></div>' +
        '<div class="field"><label>Description</label><input class="input" type="text" id="txDescription" placeholder="e.g. Owner\'s Pay draw" value="' + descVal + '"></div>' +
        '<div class="field"><label>Type</label><select class="select" id="txInflowType">' + inflowTypeOptions(inflowTypeVal) + "</select></div>" +
        '<div id="txInflowTypeNote">' + inflowTypeNote(inflowTypeVal) + '</div>' +
        sourceField +
        '<div class="field"><label>Date</label><input class="input" type="date" id="txDate" value="' + dateVal + '"></div>' +
        '<label class="check-row"><input type="checkbox" id="txEmergency"' + (emergencyChecked ? " checked" : "") + '> Emergency expense</label>' +
        '<div class="check-note">Counts against the income entitlement only — doesn\'t land in a bank account and doesn\'t split across Buckets.</div>' +
        '<div class="field" id="txAccountField" style="' + (emergencyChecked ? "display:none" : "") + '"><label>Lands in</label><select class="select" id="txAccount">' + accountOptions(editingTx ? editingTx.accountId : state.defaultAccountId) + "</select></div>";
    } else if (txType === "expense") {
      var histCheckedExp = editingTx ? !!editingTx.historical : false;
      fields =
        '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" id="txAmount" placeholder="0.00" value="' + amountVal + '"></div>' +
        '<div class="field"><label>Description</label><input class="input" type="text" id="txDescription" placeholder="e.g. Groceries" value="' + descVal + '"></div>' +
        '<div class="field"><label>Date</label><input class="input" type="date" id="txDate" value="' + dateVal + '"></div>' +
        '<div class="field"><label>Bucket</label><select class="select" id="txBucket">' + bucketOptions(editingTx ? editingTx.bucketId : null) + "</select></div>" +
        '<div class="field" id="txAccountField"><label>Paid from</label><select class="select" id="txAccount">' + accountOptions(editingTx ? editingTx.accountId : null) + "</select></div>" +
        (editingTx ? "" : splitAccountsSectionHtml(state.defaultAccountId)) +
        '<label class="check-row"><input type="checkbox" id="txHistorical"' + (histCheckedExp ? " checked" : "") + '> Historical</label>' +
        '<div class="check-note">Predates the bank account\'s current opening balance, which already reflects it. Record only — shows in the ledger, doesn\'t reduce its Account (Give/FFA/Investment/Lifestyle) or change any balance.</div>';
    } else if (txType === "debt_entry") {
      var debtDir = editingTx ? (editingTx.amount < 0 ? "decrease" : "increase") : "increase";
      var debtAcctChecked = editingTx ? !!editingTx.accountId : false;
      fields =
        '<div class="field"><label>Debt</label><select class="select" id="txDebt">' + debtOptions(editingTx ? editingTx.debtId : null) + "</select></div>" +
        '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" id="txAmount" placeholder="0.00" value="' + amountVal + '"></div>' +
        '<div class="field"><label>Direction</label><select class="select" id="txDebtDirection"><option value="increase"' + (debtDir === "increase" ? " selected" : "") + '>Increases the balance</option><option value="decrease"' + (debtDir === "decrease" ? " selected" : "") + '>Repayment / reduces the balance</option></select></div>' +
        '<div class="field"><label>Description</label><input class="input" type="text" id="txDescription" placeholder="e.g. Medical expense owed" value="' + descVal + '"></div>' +
        '<div class="field"><label>Date</label><input class="input" type="date" id="txDate" value="' + dateVal + '"></div>' +
        '<label class="check-row"><input type="checkbox" id="txDebtHasAccount"' + (debtAcctChecked ? " checked" : "") + '> Real money moved through one of my accounts</label>' +
        '<div class="check-note">Only check this if actual cash left or entered a tracked bank account. Also shows this entry in the main Ledger, not just the Debt section.</div>' +
        '<div class="field" id="txDebtAccountField" style="' + (debtAcctChecked ? "" : "display:none") + '"><label>Account</label><select class="select" id="txDebtAccount">' + accountOptions(editingTx ? editingTx.accountId : state.defaultAccountId) + "</select></div>";
    } else if (txType === "installment_payment") {
      var instDir = editingTx ? (editingTx.amount < 0 ? "decrease" : "increase") : "decrease";
      var instAcctChecked = editingTx ? !!editingTx.accountId : false;
      fields =
        '<div class="field"><label>Installment</label><select class="select" id="txInstallment">' + installmentOptions(editingTx ? editingTx.installmentId : null) + "</select></div>" +
        '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" id="txAmount" placeholder="0.00" value="' + amountVal + '"></div>' +
        '<div class="field"><label>Direction</label><select class="select" id="txInstDirection"><option value="decrease"' + (instDir === "decrease" ? " selected" : "") + '>Payment / reduces remaining balance</option><option value="increase"' + (instDir === "increase" ? " selected" : "") + '>Increases remaining balance (setup, correction)</option></select></div>' +
        '<div class="field"><label>Description</label><input class="input" type="text" id="txDescription" placeholder="e.g. Monthly installment" value="' + descVal + '"></div>' +
        '<div class="field"><label>Date</label><input class="input" type="date" id="txDate" value="' + dateVal + '"></div>' +
        '<label class="check-row"><input type="checkbox" id="txInstHasAccount"' + (instAcctChecked ? " checked" : "") + '> Real money moved through one of my accounts</label>' +
        '<div class="check-note">Only check this if actual cash left or entered a tracked bank account. Also shows this entry in the main Ledger, not just the Installments section.</div>' +
        '<div class="field" id="txInstAccountField" style="' + (instAcctChecked ? "" : "display:none") + '"><label>Account</label><select class="select" id="txInstAccount">' + accountOptions(editingTx ? editingTx.accountId : state.defaultAccountId) + "</select></div>" +
        (editingTx ? "" :
          '<label class="check-row"><input type="checkbox" id="txInstLate"> This payment was late</label>' +
          '<div class="check-note">On a real payment (not a setup/correction), this also updates the installment\'s left/late counts in Settings.</div>'
        );
    }

    var disabledNote = "";
    if (txType === "expense" && !state.buckets.length) disabledNote = '<div class="empty-state">Add a Bucket in Settings first.</div>';
    if (txType === "debt_entry" && !state.debts.length) disabledNote = '<div class="empty-state">Add a debt in Settings first.</div>';
    if (txType === "installment_payment" && !state.installments.length) disabledNote = '<div class="empty-state">Add an installment in Settings first.</div>';

    sheet.innerHTML =
      '<div class="sheet-head"><h3>' + (editingTx ? "Edit transaction" : "Add transaction") + '</h3><button class="icon-btn" id="txClose" aria-label="Close">' + xIcon() + '</button></div>' +
      segmented + (disabledNote || fields) +
      (disabledNote ? "" : '<div class="btn-row"><button class="btn btn-primary" id="txSubmit">' + (editingTx ? "Save changes" : "Log it") + '</button></div>');

    sheet.querySelector("#txClose").addEventListener("click", closeTxSheet);
    sheet.querySelectorAll('[data-action="tx-type"]').forEach(function (btn) {
      btn.addEventListener("click", function () { txType = btn.getAttribute("data-type"); renderTxSheet(); });
    });
    var submitBtn = sheet.querySelector("#txSubmit");
    if (submitBtn) submitBtn.addEventListener("click", submitTx);

    if (txType === "draw") {
      var emCheckbox = sheet.querySelector("#txEmergency");
      var accountField = sheet.querySelector("#txAccountField");
      emCheckbox.addEventListener("change", function () { accountField.style.display = emCheckbox.checked ? "none" : ""; });
      var inflowTypeSelect = sheet.querySelector("#txInflowType");
      var inflowTypeNoteEl = sheet.querySelector("#txInflowTypeNote");
      inflowTypeSelect.addEventListener("change", function () { inflowTypeNoteEl.innerHTML = inflowTypeNote(inflowTypeSelect.value); });
    } else if (txType === "expense" && !editingTx) {
      wireSplitSection(sheet);
    } else if (txType === "debt_entry") {
      var debtAcctCheckbox = sheet.querySelector("#txDebtHasAccount");
      var debtAcctField = sheet.querySelector("#txDebtAccountField");
      debtAcctCheckbox.addEventListener("change", function () { debtAcctField.style.display = debtAcctCheckbox.checked ? "" : "none"; });
    } else if (txType === "installment_payment") {
      var instAcctCheckbox = sheet.querySelector("#txInstHasAccount");
      var instAcctField = sheet.querySelector("#txInstAccountField");
      instAcctCheckbox.addEventListener("change", function () { instAcctField.style.display = instAcctCheckbox.checked ? "" : "none"; });
    }
  }

  function submitTx() {
    var amountInput = document.getElementById("txAmount");
    var amount = round2(amountInput ? parseFloat(amountInput.value) || 0 : 0);
    if (!amount || amount <= 0) { showToast("Amount must be a positive number."); return; }
    var dateEl = document.getElementById("txDate");
    var date = (dateEl && dateEl.value) || todayStr();
    var record = { type: txType, date: date };
    var wasEditing = !!editingTxId;

    if (txType === "draw") {
      var description = (document.getElementById("txDescription").value || "").trim();
      if (!description) { showToast("Description is required."); return; }
      var emergency = document.getElementById("txEmergency").checked;
      var accountId = emergency ? null : document.getElementById("txAccount").value;
      var split = emergency ? null : computeSplit(amount);
      var sourceField = document.getElementById("txSource");
      var sourceId = sourceField ? sourceField.value : defaultIncomeSourceId();
      var inflowType = document.getElementById("txInflowType").value;
      Object.assign(record, { amount: amount, description: description, emergency: emergency, accountId: accountId, split: split, sourceId: sourceId, inflowType: inflowType, historical: inflowType !== "Income" });
    } else if (txType === "expense") {
      var desc2 = (document.getElementById("txDescription").value || "").trim();
      if (!desc2) { showToast("Description is required."); return; }
      var bucketId = document.getElementById("txBucket").value;
      var historicalExp = document.getElementById("txHistorical").checked;

      // Split across accounts (new entries only, mirrors the company
      // tracker): fans out into N ordinary single-account expense
      // transactions instead of one record - computeDerived() needs no
      // special case since each row is just a normal expense.
      var splitCheckbox = document.getElementById("txExpenseSplit");
      if (!wasEditing && splitCheckbox && splitCheckbox.checked) {
        var sheet = document.getElementById("txSheet");
        var splitResult = readSplitRows(sheet, amount);
        if (!splitResult.valid) { showToast("Split amounts must add up to the total, across at least 2 accounts."); return; }
        var splitNow = Date.now();
        var splitGroupId = uid();
        splitResult.rows.forEach(function (row, i) {
          state.transactions.push({
            id: uid(), type: "expense", date: date,
            description: desc2 + " — split " + (i + 1) + "/" + splitResult.rows.length,
            amount: row.amount, bucketId: bucketId, accountId: row.accountId,
            historical: historicalExp, createdAt: splitNow + i, updatedAt: splitNow + i,
            splitGroupId: splitGroupId
          });
        });
        persist(); closeTxSheet(); render();
        showToast("Expense split across " + splitResult.rows.length + " accounts.");
        return;
      }

      var accountId2 = document.getElementById("txAccount").value;
      Object.assign(record, { amount: amount, description: desc2, bucketId: bucketId, accountId: accountId2, historical: historicalExp });
    } else if (txType === "debt_entry") {
      var debtId = document.getElementById("txDebt").value;
      if (!debtId) { showToast("Add a debt in Settings first."); return; }
      var dir = document.getElementById("txDebtDirection").value;
      var desc3 = (document.getElementById("txDescription").value || "").trim();
      if (!desc3) { showToast("Description is required."); return; }
      var debtHasAccount = document.getElementById("txDebtHasAccount").checked;
      var debtAccountId = debtHasAccount ? document.getElementById("txDebtAccount").value : null;
      Object.assign(record, { amount: dir === "decrease" ? -amount : amount, description: desc3, debtId: debtId, accountId: debtAccountId });
    } else if (txType === "installment_payment") {
      var instId = document.getElementById("txInstallment").value;
      if (!instId) { showToast("Add an installment in Settings first."); return; }
      var dir2 = document.getElementById("txInstDirection").value;
      var desc4 = (document.getElementById("txDescription").value || "").trim();
      if (!desc4) { showToast("Description is required."); return; }
      var instHasAccount = document.getElementById("txInstHasAccount").checked;
      var instAccountId = instHasAccount ? document.getElementById("txInstAccount").value : null;
      Object.assign(record, { amount: dir2 === "decrease" ? -amount : amount, description: desc4, installmentId: instId, accountId: instAccountId });
      // A real, newly-logged payment (not an edit, not a setup/correction
      // "increase") also updates the installment's left/late counts — edits
      // deliberately leave these alone; correct them directly in Settings if
      // a count itself was wrong, rather than by re-editing a payment.
      var lateCheckbox = document.getElementById("txInstLate");
      if (!wasEditing && dir2 === "decrease") {
        record.late = !!(lateCheckbox && lateCheckbox.checked);
        record.countedAsPayment = true;
        var instForCounters = installmentById(instId);
        if (instForCounters) {
          instForCounters.installmentsLeft = Math.max(0, (Number(instForCounters.installmentsLeft) || 0) - 1);
          if (record.late) instForCounters.lateCount = (Number(instForCounters.lateCount) || 0) + 1;
        }
      }
    }

    if (wasEditing) {
      var existing = state.transactions.find(function (t) { return t.id === editingTxId; });
      if (existing) { Object.assign(existing, record); existing.updatedAt = Date.now(); }
    } else {
      record.id = uid();
      record.createdAt = Date.now();
      state.transactions.push(record);
    }

    persist();
    closeTxSheet();
    render();
    showToast(wasEditing ? "Saved." : "Logged.");
  }

  /* ---------------- collapsible sections (Prudy artifact style) ---------------- */
  // The header text AND the always-visible summary card underneath it both
  // toggle the same body - matches Prudy's artifact, where the whole summary
  // card is one big click target, not just its title.
  ["expenses", "debt", "installment"].forEach(function (key) {
    var body = document.getElementById(key + "Body");
    var chevron = document.getElementById(key + "Chevron");
    var summary = document.getElementById(key + "Summary");
    function toggle() {
      var isOpen = body.style.display !== "none";
      body.style.display = isOpen ? "none" : "";
      chevron.classList.toggle("open", !isOpen);
    }
    document.querySelector('[data-toggle="' + key + '"]').addEventListener("click", toggle);
    summary.style.cursor = "pointer";
    summary.addEventListener("click", toggle);
  });
  document.querySelector('[data-toggle="ledger"]').addEventListener("click", function () {
    var body = document.getElementById("ledgerBody");
    var chevron = document.getElementById("ledgerChevron");
    var isOpen = body.style.display !== "none";
    body.style.display = isOpen ? "none" : "";
    chevron.classList.toggle("open", !isOpen);
  });

  /* ---------------- ledger actions ---------------- */
  function handleLedgerActionClick(e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    if (action === "delete") {
      openConfirm("Delete this transaction? This can't be undone.", "Delete", true).then(function (ok) {
        if (!ok) return;
        var deletedTx = state.transactions.find(function (t) { return t.id === id; });
        if (deletedTx && deletedTx.countedAsPayment) {
          var inst = installmentById(deletedTx.installmentId);
          if (inst) {
            inst.installmentsLeft = (Number(inst.installmentsLeft) || 0) + 1;
            if (deletedTx.late) inst.lateCount = Math.max(0, (Number(inst.lateCount) || 0) - 1);
          }
        }
        state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
        // Tombstone the id so this deletion survives a stale client (this
        // browser's own cache, or Prudy's device) that still has the old
        // entry and would otherwise push it right back on its next sync.
        if (!Array.isArray(state.deletedTransactionIds)) state.deletedTransactionIds = [];
        if (state.deletedTransactionIds.indexOf(id) === -1) state.deletedTransactionIds.push(id);
        persist(); render();
        showToast("Deleted.");
      });
    } else if (action === "edit") {
      var tx = state.transactions.find(function (t) { return t.id === id; });
      if (tx) openEditTxSheet(tx);
    }
  }
  document.getElementById("ledgerSection").addEventListener("click", handleLedgerActionClick);
  document.getElementById("debtLedgerSection").addEventListener("click", handleLedgerActionClick);
  document.getElementById("installmentLedgerSection").addEventListener("click", handleLedgerActionClick);

  /* ---------------- settings sheet (live-persist, copied from the company tracker's own pattern) ---------------- */
  function openSettingsSheet() { document.getElementById("settingsOverlay").classList.add("open"); renderSettingsSheet(); }
  function closeSettingsSheet() { document.getElementById("settingsOverlay").classList.remove("open"); render(); }

  function renderSettingsSheet() {
    var sheet = document.getElementById("settingsSheet");
    var cSum = pctSum();

    var html = '<div class="sheet-head"><h3>Settings</h3><button class="icon-btn" id="setClose" aria-label="Close">' + xIcon() + '</button></div>';

    html += '<div class="settings-section"><h4>General</h4>' +
      '<div class="field"><label>Name</label><input class="input" id="sPerson" value="' + esc(state.person) + '"></div>' +

    html += '<button class="add-row-btn" id="addBucket">+ Add Bucket</button>';
    html += '<div class="sum-note ' + (cSum === 100 ? "ok" : "bad") + '">Share total: ' + cSum + '%' + (cSum === 100 ? " — splits nicely into 100%" : " — should add up to 100% or splits will be off") + '</div>';
    html += '</div>';

    html += '<div class="settings-section"><h4>Bank Accounts</h4><div class="ledger-note" style="margin-top:-6px">Use the arrows to reorder — this order sets the display order everywhere (dashboard, dropdowns). Beneficiary accounts (money tracked on someone else\'s behalf — Maryam, Jawaher, etc.) are for tracking only and never show on the main dashboard.</div>';
    html += state.accounts.map(function (a, idx) {
      var isDefault = a.id === state.defaultAccountId || (!state.defaultAccountId && state.accounts[0] && state.accounts[0].id === a.id);
      var acctType = a.type || "personal";

          '<div class="reorder-btns">' +
            '<button class="reorder-btn" data-move-account="' + a.id + '" data-dir="up" aria-label="Move up"' + (idx === 0 ? " disabled" : "") + '>' + upIcon() + '</button>' +
            '<button class="reorder-btn" data-move-account="' + a.id + '" data-dir="down" aria-label="Move down"' + (idx === state.accounts.length - 1 ? " disabled" : "") + '>' + downIcon() + '</button>' +

          '<button class="del-btn" data-del-account="' + a.id + '" aria-label="Remove account">' + xIcon() + '</button>' +
        '</div>' +
        '<div class="field" style="margin-top:8px"><select class="select" data-field="type">' +
          '<option value="personal"' + (acctType === "personal" ? " selected" : "") + '>Personal — shows on the dashboard</option>' +
          '<option value="beneficiary"' + (acctType === "beneficiary" ? " selected" : "") + '>Beneficiary — tracking only</option>' +
        '</select></div>' +
